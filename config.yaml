# Config-driven (never hardcode symbols in code); regenerate with
# src/equity_agent/data/universe.py. Tickers normalized for yfinance (BRK.B -> BRK-B)
# and quoted so YAML doesn't read e.g. ON/NO as booleans.
# SURVIVORSHIP-BIAS WARNING: this is *today's* index membership (as of 2026-06-24); using it
# over 2015-2026 history is survivorship-biased (delisted/dropped names absent, current
# members conditioned on having survived). Snapshot: data/sp500_constituents_2026-06-24.csv
