benchmark: SPY          # buy-and-hold benchmark; strategy must beat it risk-adjusted
regime_symbols:         # used as market-regime features, not traded (no API key — yfinance)
  - SPY
  - "^VIX"
  - "^TNX"              # 10-year Treasury yield
  - "DX-Y.NYB"          # US dollar index
  - TLT                 # 20y+ Treasuries (long bonds)
  - HYG                 # high-yield credit
  - LQD                 # investment-grade credit
  - GLD                 # gold

timeframe: "1d"         # daily swing — avoids PDT rule, matches news/LLM cadence
history_start: "2015-01-01"

fred_series:            # macro series from FRED (needs FRED_API_KEY)
  - DGS2                # 2-year Treasury yield
  - DGS10               # 10-year Treasury yield  (DGS10-DGS2 = 2s10s slope)
  - DFII10              # 10-year real yield (TIPS)
  - BAMLH0A0HYM2        # high-yield credit OAS spread

data_dir: data
